name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superengine/superengine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
          build-root-directory: superengine/superengine
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: superengine-jar
          path: superengine/superengine/build/libs/*.jar
